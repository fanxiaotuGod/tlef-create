{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tlef-create.backend.fullname" . }}
  labels:
    {{- include "tlef-create.labels" . | nindent 4 }}
    component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tlef-create.selectorLabels" . | nindent 4 }}
    component: backend
{{- end }}
