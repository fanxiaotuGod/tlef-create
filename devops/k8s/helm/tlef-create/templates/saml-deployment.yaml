{{- if .Values.saml.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tlef-create.saml.fullname" . }}
  labels:
    {{- include "tlef-create.labels" . | nindent 4 }}
    component: saml
spec:
  replicas: 1
  revisionHistoryLimit: 2  # Keep only 2 old ReplicaSets
  selector:
    matchLabels:
      {{- include "tlef-create.selectorLabels" . | nindent 6 }}
      component: saml
  template:
    metadata:
      labels:
        {{- include "tlef-create.selectorLabels" . | nindent 8 }}
        component: saml
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: saml
          image: "{{ .Values.saml.image.repository }}:{{ .Values.saml.image.tag }}"
          imagePullPolicy: {{ .Values.saml.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.saml.service.port }}
          resources:
            {{- toYaml .Values.saml.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tlef-create.saml.fullname" . }}
  labels:
    {{- include "tlef-create.labels" . | nindent 4 }}
    component: saml
spec:
  type: {{ .Values.saml.service.type }}
  ports:
    - port: {{ .Values.saml.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "tlef-create.selectorLabels" . | nindent 4 }}
    component: saml
{{- end }}
