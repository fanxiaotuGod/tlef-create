apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tlef-create.fullname" . }}-secrets
  labels:
    {{- include "tlef-create.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MongoDB credentials
  mongodb-password: {{ .Values.secrets.mongodb.password | default "changeme-mongodb-password" | quote }}

  # Qdrant API key
  qdrant-api-key: {{ .Values.secrets.qdrant.apiKey | default "changeme-qdrant-key" | quote }}

  # Backend secrets
  session-secret: {{ .Values.secrets.backend.sessionSecret | default "changeme-session-secret" | quote }}
  openai-api-key: {{ .Values.secrets.backend.openaiApiKey | default "sk-placeholder-key-change-me" | quote }}

  # SAML configuration
  saml-callback-url: {{ .Values.secrets.backend.samlCallbackUrl | default (printf "http://%s/api/create/auth/saml/callback" (.Values.global.domain | default "localhost")) | quote }}
  saml-logout-callback-url: {{ .Values.secrets.backend.samlLogoutCallbackUrl | default (printf "http://%s/api/create/auth/logout/callback" (.Values.global.domain | default "localhost")) | quote }}
