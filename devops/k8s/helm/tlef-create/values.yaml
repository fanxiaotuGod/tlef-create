# Default values for tlef-create staging deployment
# This is a YAML-formatted file.

# Global settings
global:
  environment: staging
  domain: "" # Set to your domain (e.g., staging.example.com) or leave empty for IP-based access

# Frontend configuration
frontend:
  enabled: true  # ENABLED: Databases are healthy, backend is running
  replicaCount: 1
  image:
    repository: "396913700179.dkr.ecr.us-west-2.amazonaws.com/tlef-create-frontend"
    tag: "staging-a73f3a1" # Will be updated by CI/CD with git SHA
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Backend configuration
backend:
  enabled: true  # TESTING: Enable backend only to fix InvalidImageName
  replicaCount: 1
  image:
    repository: "396913700179.dkr.ecr.us-west-2.amazonaws.com/tlef-create-backend"
    tag: "staging-a73f3a1" # Testing with latest tag to isolate image pull issues
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8051
  env:
    nodeEnv: "production"
    port: "8051"
    llmProvider: "openai"
    openaiModel: "gpt-4o-mini"
    maxFileSize: "104857600"
    uploadDir: "/app/routes/create/uploads"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
  persistence:
    enabled: true
    storageClass: "" # Use default storage class
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /app/routes/create/uploads

# MongoDB configuration
mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 27017
  auth:
    username: tlef-app
    password: "" # Set via secrets
    database: tlef-create
  persistence:
    enabled: false  # Temporarily disabled to reduce I/O overhead
    storageClass: "" # Use default storage class
    accessMode: ReadWriteOnce
    size: 5Gi  # Reduced from 10Gi
  resources:
    requests:
      memory: "128Mi"  # Reduced from 256Mi
      cpu: "100m"      # Reduced from 200m
    limits:
      memory: "256Mi"  # Reduced from 512Mi
      cpu: "250m"      # Reduced from 500m

# Qdrant configuration
qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.14.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334
  apiKey: "" # Set via secrets
  persistence:
    enabled: false  # Temporarily disabled to reduce I/O overhead
    storageClass: "" # Use default storage class
    accessMode: ReadWriteOnce
    size: 5Gi  # Reduced from 10Gi
  resources:
    requests:
      memory: "128Mi"  # Reduced from 256Mi
      cpu: "100m"      # Reduced from 200m
    limits:
      memory: "256Mi"  # Reduced from 512Mi
      cpu: "250m"      # Reduced from 500m

# SAML configuration
saml:
  enabled: true  # ENABLED: Application layer is healthy, enabling SAML
  image:
    repository: 396913700179.dkr.ecr.us-west-2.amazonaws.com/tlef-create-saml
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  entityId: "https://tlef-create-staging"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Ingress configuration
ingress:
  enabled: true
  className: "traefik" # K3s includes Traefik by default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-staging" # For SSL/TLS
    traefik.ingress.kubernetes.io/router.entrypoints: "web" # HTTP entrypoint
  hosts:
    - host: "" # Leave empty for IP-based access, or set to your domain
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
  # Uncomment when you have a domain and SSL cert
  # tls:
  #   - secretName: tlef-tls
  #     hosts:
  #       - staging.example.com

# Secrets (will be created separately or via Sealed Secrets)
secrets:
  mongodb:
    password: "" # Set via kubectl create secret or CI/CD
  qdrant:
    apiKey: "" # Set via kubectl create secret or CI/CD
  backend:
    sessionSecret: "" # Set via kubectl create secret or CI/CD
    openaiApiKey: "sk-placeholder-key-change-me" # Set via kubectl create secret or CI/CD
    samlCallbackUrl: ""
    samlLogoutCallbackUrl: ""

# Monitoring
monitoring:
  enabled: false  # PHASE 4: Enable after core application is working
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: "v2.45.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 9090
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "200m"
  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: "10.1.0"
      pullPolicy: IfNotPresent
    service:
      type: NodePort # Expose for external access
      port: 3000
      nodePort: 30000
    adminUser: admin
    adminPassword: "" # Set via secrets
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Network Policies (optional, for enhanced security)
networkPolicy:
  enabled: false

# Pod Security Policy
podSecurityPolicy:
  enabled: false

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "tlef-create-sa"

# Automatic Cleanup
cleanup:
  enabled: true  # Enable automatic cleanup of failed pods and old ReplicaSets
